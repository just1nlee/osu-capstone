name: Scaffold CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: playground/mediapipe-example
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Launch scaffold and run behavior tests
        run: npm test
